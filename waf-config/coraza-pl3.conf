# Coraza WAF Configuration — Paranoia Level 3 (Stricter)
# Used by BypassEvo for WAF bypass research

Include /etc/coraza/crs/crs-setup.conf
Include /etc/coraza/crs/rules/*.conf

# Paranoia Level 3 — more rules, catches more bypass attempts
SecAction "id:900000,phase:1,nolog,pass,t:none,setvar:tx.blocking_paranoia_level=3"
SecAction "id:900001,phase:1,nolog,pass,t:none,setvar:tx.detection_paranoia_level=3"

SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json

# Lower threshold = more aggressive blocking
SecAction "id:900110,phase:1,pass,t:none,setvar:'tx.inbound_anomaly_score_threshold=3',setvar:'tx.outbound_anomaly_score_threshold=3'"

SecDefaultAction "phase:2,deny,log,status:403"

SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /dev/stderr
