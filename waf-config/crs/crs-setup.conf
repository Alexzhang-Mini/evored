# OWASP CRS Setup Configuration for Coraza
# Used by BypassEvo WAF bypass research sandbox

# Default action: block
SecDefaultAction "phase:2,deny,log,status:403"

# Anomaly scoring
SecAction "id:900110,phase:1,pass,t:none,\
  setvar:'tx.inbound_anomaly_score_threshold=5',\
  setvar:'tx.outbound_anomaly_score_threshold=4'"

# Allowed HTTP methods
SecAction "id:900200,phase:1,nolog,pass,t:none,\
  setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# Allowed request content types
SecAction "id:900220,phase:1,nolog,pass,t:none,\
  setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json|'"

# Allowed HTTP versions
SecAction "id:900230,phase:1,nolog,pass,t:none,\
  setvar:'tx.allowed_http_versions=HTTP/1.0 HTTP/1.1 HTTP/2 HTTP/2.0'"

# Enable blocking
SecAction "id:900990,phase:1,nolog,pass,t:none,\
  setvar:'tx.blocking_early=0'"
