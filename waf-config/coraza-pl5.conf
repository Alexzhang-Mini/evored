# Coraza WAF Configuration — Paranoia Level 5 (Maximum)
# Used by BypassEvo for WAF bypass research

Include /etc/coraza/crs/crs-setup.conf
Include /etc/coraza/crs/rules/*.conf

# Paranoia Level 5 — maximum detection, highest false positive rate
SecAction "id:900000,phase:1,nolog,pass,t:none,setvar:tx.blocking_paranoia_level=5"
SecAction "id:900001,phase:1,nolog,pass,t:none,setvar:tx.detection_paranoia_level=5"

SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json

# Very low threshold = most aggressive blocking
SecAction "id:900110,phase:1,pass,t:none,setvar:'tx.inbound_anomaly_score_threshold=2',setvar:'tx.outbound_anomaly_score_threshold=2'"

SecDefaultAction "phase:2,deny,log,status:403"

SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /dev/stderr
