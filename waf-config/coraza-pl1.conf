# Coraza WAF Configuration — Paranoia Level 1 (Default)
# Used by BypassEvo for WAF bypass research

# Include OWASP CRS
Include /etc/coraza/crs/crs-setup.conf
Include /etc/coraza/crs/rules/*.conf

# Paranoia Level 1 — balanced detection, low false positives
SecAction "id:900000,phase:1,nolog,pass,t:none,setvar:tx.blocking_paranoia_level=1"
SecAction "id:900001,phase:1,nolog,pass,t:none,setvar:tx.detection_paranoia_level=1"

# Enable response body inspection
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json

# Anomaly scoring threshold
SecAction "id:900110,phase:1,pass,t:none,setvar:'tx.inbound_anomaly_score_threshold=5',setvar:'tx.outbound_anomaly_score_threshold=4'"

# Block on threshold
SecDefaultAction "phase:2,deny,log,status:403"

# Logging
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /dev/stderr
